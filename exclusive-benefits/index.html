tats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:17px 0}.stat{border-radius:16px;padding:18px;background:linear-gradient(125deg,#50331b,#271b1c);border:1px solid #805324;min-height:112px}.stat:nth-child(2){background:linear-gradient(125deg,#34274a,#1d1b30);border-color:#6d518b}.stat:nth-child(3){background:linear-gradient(125deg,#273d59,#1b263b);border-color:#496789}.stat .name{font-size:15px;color:#e6e3e4}.stat strong{display:block;font-size:30px;margin:8px 0;color:#ffc14d}.stat:nth-child(n+2) strong{color:#fff}.stat small{color:#bbb}.stat button{float:right;border-radius:9px;padding:9px;background:#ffa51b;color:#151515}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.filters button{border-radius:28px;padding:10px 19px;background:#2c2e36;color:#c7c8d0}.filters .selected{background:#ffa31a;color:#1d1710;font-weight:bold}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.task{background:linear-gradient(145deg,#2b2d33,#22242a);border:1px solid #383a42;border-radius:17px;padding:17px;min-height:194px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}.taskhead{display:flex;align-items:center;gap:11px}.taskico{font-size:29px;background:#3a3936;border-radius:13px;width:52px;height:52px;display:grid;place-items:center}.task h3{font-size:18px;margin:0}.task h3 span{font-size:11px;color:#ffc064;background:#513b1e;padding:4px 7px;border-radius:12px;white-space:nowrap}.task p{color:#b9bac2;font-size:12px;margin:8px 0 0}.metric{font-size:13px;color:#d7d7db}.bar{height:9px;background:#505159;border-radius:9px;overflow:hidden;margin:8px 0}.bar div{height:100%;background:linear-gradient(90deg,#ff9200,#ffbd44)}.taskbottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.taskbottom b{font-size:13px;color:#ffb643}.taskbottom button,.primary{background:linear-gradient(#ffc047,#ff9400);border-radius:9px;padding:10px 14px;color:#1d1305;font-weight:bold}.mobile-tabs{display:none}.empty{padding:70px 20px;text-align:center;color:#aaa}.back{background:none;color:#ddd;padding:10px 0}.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin-top:10px}.panel{background:#272930;border:1px solid #40424b;border-radius:16px;padding:22px}.panel h2{margin-top:0}.panel .large{font-size:30px;color:#ffb43a;font-weight:bold}.reward-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #444650}.reward-row button{padding:8px 12px;background:#ffa21b;border-radius:8px}.muted{color:#aeb0ba;font-size:13px}.modalbg{position:fixed;inset:0;background:#000b;z-index:30;display:grid;place-items:center;padding:20px}.modal{width:min(380px,100%);background:#26272e;border:1px solid #625039;border-radius:20px;padding:25px;text-align:center}.modal .emoji{font-size:64px}.modal h2{color:#ffb63e}.modal button{width:100%;margin-top:15px;padding:12px;border-radius:10px;background:#ffab23;font-weight:bold}.phone .app{max-width:390px;min-height:780px;border:7px solid #33343b;border-radius:34px;overflow:hidden}.phone .side,.phone .top .notice{display:none}.phone .top{padding:0 10px;height:55px}.phone .logo{font-size:18px}.phone .top button{padding:7px 10px;margin-left:4px;font-size:12px}.phone .main{padding:11px 10px 80px}.phone .mobile-tabs{display:flex;gap:6px;margin-bottom:10px}.phone .mobile-tabs button{width:50%;padding:11px 5px;border-radius:9px;background:#292c34;color:white}.phone .mobile-tabs button.active{background:#ffa21c;color:#111}.phone .banner{height:105px;padding:15px}.phone .banner h1{font-size:27px}.phone .banner p{font-size:11px}.phone .banner .present{font-size:52px}.phone .stats{grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.phone .stat{min-height:88px;padding:12px}.phone .stat strong{font-size:22px}.phone .stat .name{font-size:12px}.phone .stat small{font-size:10px}.phone .stat:nth-child(3){grid-column:span 2;min-height:56px;display:flex;align-items:center;justify-content:space-between}.phone .stat:nth-child(3) strong{margin:0}.phone .filters{gap:5px;margin:12px 0}.phone .filters button{font-size:11px;padding:9px 11px}.phone .cards{grid-template-columns:1fr;gap:9px}.phone .task{min-height:128px;padding:12px;gap:8px}.phone .taskico{width:40px;height:40px;font-size:23px}.phone .task h3{font-size:15px}.phone .task p{font-size:11px}.phone .taskbottom button{padding:8px 11px;font-size:12px}.phone .detail{grid-template-columns:1fr}.phone .panel{padding:14px}.phone .mobile-footer{display:flex}.mobile-footer{display:none;position:sticky;bottom:0;background:#15161a;padding:13px 10px;justify-content:space-around;border-top:1px solid #444}.mobile-footer button{background:none;color:#bbb}.mobile-footer .active{color:#ffb02a}.hint{color:#999;font-size:11px;margin-top:16px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.side{width:160px}.banner h1{font-size:32px}}@media(max-width:620px){.demo small{display:none}.demo button{padding:8px}.app{max-width:390px}.side,.top .notice{display:none}.top{height:55px}.main{padding:12px}.mobile-tabs{display:flex;gap:8px;margin-bottom:10px}.mobile-tabs button{flex:1;background:#2b2d32;color:white;border-radius:9px;padding:10px}.mobile-tabs .active{background:#ffa21b;color:#111}.banner{height:105px}.banner h1{font-size:26px}.banner p{font-size:12px}.banner .present{font-size:50px}.stats{grid-template-columns:1fr 1fr}.stat{padding:11px;min-height:85px}.stat strong{font-size:23px}.stat:nth-child(3){grid-column:span 2;min-height:55px}.cards,.detail{grid-template-columns:1fr}.task{min-height:135px}.mobile-footer{display:flex}}
</style></head><body><div class="demo"><small>V.VIP · 专属福利 PC/H5 交互原型（演示数据）</small><div><button id="pc" class="on" onclick="setDevice('pc')">▣ PC</button> <button id="h5" onclick="setDevice('h5')">▦ H5</button> <button onclick="resetDemo()">↻ 重置演示</button></div></div><div id="shell"><div class="app"><header class="top"><div class="logo">🟠 V.VIP</div><div class="notice">📣 尊敬的用户：欧洲杯期间热门赛事加码已上线，完成互动即可领取礼包。</div><div><button onclick="toggleLogin()" id="loginBtn">退出登录</button><button class="gold" onclick="showModal('演示说明','本页面使用模拟会员及任务数据，可体验领取、进度、状态和登录。')">注册</button></div></header><div class="body"><aside class="side"><button class="nav" id="navPromo" onclick="setSection('promo')">♔ 优惠活动</button><button class="nav active" id="navBenefit" onclick="setSection('benefit')">♛ 专属福利</button><p>热门推荐</p><p>体育竞技　›</p><p>真人娱乐　›</p><p>棋牌游戏　›</p><p>电子钓鱼　›</p><p>彩票游戏　›</p><p>电竞游戏　›</p><p>个人中心</p><p>合作赞助</p><p>APP下载</p></aside><main class="main"><div class="mobile-tabs"><button id="mobilePromo" onclick="setSection('promo')">♔ 优惠活动</button><button id="mobileBenefit" class="active" onclick="setSection('benefit')">♛ 专属福利</button></div><div id="content"></div></main></div><footer class="mobile-footer"><button onclick="setSection('promo')">⌂ 首页</button><button onclick="setSection('promo')">♧ 娱乐</button><button class="active" onclick="setSection('benefit')">♛ 专属福利</button><button onclick="showModal('个人中心','当前为原型演示。')">♙ 我的</button></footer></div></div><div id="modalRoot"></div><script>
const base=[{id:0,name:'每日存款',tag:'每日重置',icon:'👛',desc:'每日累计存款达标，领取对应奖励',metric:'今日存款：300 / 500 元',pct:60,reward:5,state:'进行中',button:'去完成'},{id:1,name:'晒单福利',tag:'任务奖励',icon:'📸',desc:'完成指定内容晒单并通过审核，领取奖励',metric:'任务已完成，可领取奖励',pct:100,reward:20,state:'待领取',button:'领取奖励'},{id:2,name:'存款三重礼',tag:'阶梯奖励',icon:'🎁',desc:'完成不同存款档位，解锁三重好礼',metric:'已完成 2 / 3 档',pct:66,reward:30,state:'已领取',button:'查看详情'},{id:3,name:'沉默回归',tag:'回归专享',icon:'👤',desc:'久未活跃会员专属福利，回归即享好礼',metric:'符合参与条件',pct:null,reward:20,state:'进行中',button:'立即参与'},{id:4,name:'周五存送',tag:'每周五',icon:'🗓️',desc:'每周五存款享额外礼包',metric:'距下一次活动：2天12:36:20',pct:null,reward:88,state:'进行中',button:'查看详情'},{id:5,name:'周期流水',tag:'周期任务',icon:'📊',desc:'周期内累计有效流水达标，领取奖励',metric:'累计流水：5,000 / 15,000 元',pct:33,reward:50,state:'进行中',button:'去完成'}];let tasks,section='benefit',filter='全部',detail=null,logged=true,received=268;function resetDemo(){tasks=structuredClone(base);received=268;section='benefit';filter='全部';detail=null;logged=true;render()}function setDevice(d){document.body.classList.toggle('phone',d==='h5');document.getElementById('pc').classList.toggle('on',d==='pc');document.getElementById('h5').classList.toggle('on',d==='h5')}function setSection(s){section=s;detail=null;filter='全部';render()}function toggleLogin(){logged=!logged;render()}function setFilter(f){filter=f;render()}function openDetail(id){detail=id;render()}function showModal(title,body){document.getElementById('modalRoot').innerHTML='<div class="modalbg" onclick="closeModal(event)"><div class="modal"><div class="emoji">🎁</div><h2>'+title+'</h2><p>'+body+'</p><button onclick="closeModal()">确定</button></div></div>'}function closeModal(e){if(e&&e.target.className!=='modalbg')return;document.getElementById('modalRoot').innerHTML=''}function requireLogin(){if(!logged){showModal('请先登录','登录后即可查看进度并领取奖励。');return false}return true}function claim(id){if(!requireLogin())return;let t=tasks[id];if(t.state!=='待领取'){showModal('暂不可领取','当前任务尚未满足领取条件。');return}t.state='已领取';t.button='已领取';received+=t.reward;render();showModal('领取成功','恭喜获得 ¥'+t.reward.toFixed(2)+' 演示奖励！')}function action(id){if(!requireLogin())return;let t=tasks[id];if(t.state==='待领取'){claim(id);return}if(t.state==='已领取'){openDetail(id);return}if(id===0||id===5){openDetail(id);return}if(id===3){t.state='待领取';t.button='领取奖励';t.metric='回归任务已完成';render();showModal('任务完成','已模拟完成回归任务，现在可以领取奖励。');return}openDetail(id)}function simulate(id){if(!requireLogin())return;let t=tasks[id];t.pct=100;t.state='待领取';t.button='领取奖励';t.metric='任务已达标，奖励待领取';render();showModal('任务已达标','已模拟完成任务，可领取奖励。')}function cards(){let arr=tasks.filter(t=>filter==='全部'||t.state===filter);return arr.length?'<div class="cards">'+arr.map(t=>'<div class="task"><div class="taskhead"><div class="taskico">'+t.icon+'</div><div><h3>'+t.name+' <span>'+t.tag+'</span></h3><p>'+t.desc+'</p></div></div><div><div class="metric">'+(logged?t.metric:'登录后查看任务进度')+'</div>'+(logged&&t.pct!==null?'<div class="bar"><div style="width:'+t.pct+'%"></div></div>':'')+'<div class="taskbottom"><b>'+(logged?(t.state==='已领取'?'已领取':t.state==='待领取'?'待领取奖励：¥'+t.reward.toFixed(2):'奖励参考：¥'+t.reward.toFixed(2)):'登录后查看奖励')+'</b><button onclick="action('+t.id+')">'+(logged?t.button:'查看详情')+'</button></div></div></div>').join('')+'</div>':'<div class="empty">暂无相关任务</div>'}function home(){let pending=tasks.filter(t=>t.state==='待领取').reduce((a,t)=>a+t.reward,0);let done=tasks.filter(t=>t.state==='已领取').length;return '<div class="banner"><div><h1>♛ 专属福利</h1><p>完成专属任务 · 领取丰厚奖励</p></div><div class="present">🎁</div></div><div class="stats"><div class="stat"><div class="name">🎁 待领取奖励</div><strong>¥ '+(logged?pending.toFixed(2):'--')+'</strong><small>可立即领取的奖励</small> '+(pending&&logged?'<button onclick="setFilter(\'待领取\')">去领取</button>':'')+'</div><div class="stat"><div class="name">🪙 已领取奖励</div><strong>¥ '+(logged?received.toFixed(2):'--')+'</strong><small>累计成功领取</small></div><div class="stat"><div class="name">☑ 已完成任务</div><strong>'+(logged?done+' / 6':'--')+'</strong><small>演示任务统计</small></div></div><div class="filters">'+['全部','进行中','待领取','已领取'].map(f=>'<button class="'+(filter===f?'selected':'')+'" onclick="setFilter(\''+f+'\')">'+f+' ('+(f==='全部'?tasks.length:tasks.filter(t=>t.state===f).length)+')</button>').join('')+'</div>'+cards()+'<p class="hint">注：任务进度、奖励金额、统计口径均为原型演示数据；非现金类奖励不纳入现金金额汇总。</p>'}function details(){let t=tasks[detail];return '<button class="back" onclick="detail=null;render()">‹ 返回专属福利</button><div class="banner"><div><h1>'+t.name+'</h1><p>'+t.desc+'</p></div><div class="present">'+t.icon+'</div></div><div class="detail"><section class="panel"><h2>我的任务进度</h2><p class="muted">'+(logged?t.metric:'登录后查看任务进度')+'</p>'+(t.pct!==null?'<div class="bar"><div style="width:'+(logged?t.pct:0)+'%"></div></div>':'')+'<p>当前状态：<b style="color:#ffb33b">'+(logged?t.state:'未登录')+'</b></p><div class="large">¥ '+t.reward.toFixed(2)+'</div><p class="muted">演示奖励金额</p><button class="primary" onclick="'+(t.state==='待领取'?'claim('+t.id+')':t.state==='已领取'?'showModal(\'已领取\',\'本次演示奖励已经领取。\')':'simulate('+t.id+')')+'">'+(t.state==='待领取'?'领取奖励':t.state==='已领取'?'已领取':'模拟完成任务')+'</button></section><section class="panel"><h2>活动内容</h2><p>'+t.desc+'</p><h3>任务奖励</h3><div class="reward-row"><span>奖励金额</span><b style="color:#ffb33b">¥ '+t.reward.toFixed(2)+'</b></div><h3>活动规则</h3><p class="muted">1. 具体参与资格、任务统计周期与奖励规则以运营配置为准。</p><p class="muted">2. 原型提供模拟完成与领取交互，不调用真实存款、投注或奖励接口。</p><p class="muted">3. 奖励领取后更新顶部累计金额与任务状态。</p></section></div>'}function promo(){return '<div class="banner"><div><h1>优惠活动</h1><p>限时 · 新人 · 日常 · VIP · 长期</p></div><div class="present">🎉</div></div><div class="panel" style="margin-top:18px"><h2>原有优惠活动专区</h2><p class="muted">本次仅演示一级入口切换，原有优惠活动列表及详情逻辑保持不变。</p><button class="primary" onclick="setSection(\'benefit\')">进入专属福利</button></div>'}function render(){document.getElementById('loginBtn').textContent=logged?'退出登录':'登录';document.getElementById('navPromo').classList.toggle('active',section==='promo');document.getElementById('navBenefit').classList.toggle('active',section==='benefit');document.getElementById('mobilePromo').classList.toggle('active',section==='promo');document.getElementById('mobileBenefit').classList.toggle('active',section==='benefit');document.getElementById('content').innerHTML=section==='promo'?promo():detail!==null?details():home()}resetDemo();
</script></body></html>
