const base=[{id:0,name:'每日存款',tag:'每日重置',icon:'👛',desc:'每日累计存款达标，领取对应奖励',metric:'今日存款：300 / 500 元',pct:60,reward:5,state:'进行中',button:'去完成'},{id:1,name:'晒单福利',tag:'任务奖励',icon:'📸',desc:'完成指定内容晒单并通过审核，领取奖励',metric:'任务已完成，可领取奖励',pct:100,reward:20,state:'待领取',button:'领取奖励'},{id:2,name:'存款三重礼',tag:'阶梯奖励',icon:'🎁',desc:'完成不同存款档位，解锁三重好礼',metric:'已完成 2 / 3 档',pct:66,reward:30,state:'已领取',button:'查看详情'},{id:3,name:'沉默回归',tag:'回归专享',icon:'👤',desc:'久未活跃会员专属福利，回归即享好礼',metric:'符合参与条件',pct:null,reward:20,state:'进行中',button:'立即参与'},{id:4,name:'周五存送',tag:'每周五',icon:'🗓️',desc:'每周五存款享额外礼包',metric:'距下一次活动：2天12:36:20',pct:null,reward:88,state:'进行中',button:'查看详情'},{id:5,name:'周期流水',tag:'周期任务',icon:'📊',desc:'周期内累计有效流水达标，领取奖励',metric:'累计流水：5,000 / 15,000 元',pct:33,reward:50,state:'进行中',button:'去完成'}];let tasks,section='benefit',filter='全部',detail=null,logged=true,received=268;function resetDemo(){tasks=structuredClone(base);received=268;section='benefit';filter='全部';detail=null;logged=true;render()}function setDevice(d){document.body.classList.toggle('phone',d==='h5');document.getElementById('pc').classList.toggle('on',d==='pc');document.getElementById('h5').classList.toggle('on',d==='h5')}function setSection(s){section=s;detail=null;filter='全部';render()}function toggleLogin(){logged=!logged;render()}function setFilter(f){filter=f;render()}function openDetail(id){detail=id;render()}function showModal(title,body){document.getElementById('modalRoot').innerHTML='<div class="modalbg" onclick="closeModal(event)"><div class="modal"><div class="emoji">🎁</div><h2>'+title+'</h2><p>'+body+'</p><button onclick="closeModal()">确定</button></div></div>'}function closeModal(e){if(e&&e.target.className!=='modalbg')return;document.getElementById('modalRoot').innerHTML=''}function requireLogin(){if(!logged){showModal('请先登录','登录后即可查看进度并领取奖励。');return false}return true}function claim(id){if(!requireLogin())return;let t=tasks[id];if(t.state!=='待领取'){showModal('暂不可领取','当前任务尚未满足领取条件。');return}t.state='已领取';t.button='已领取';received+=t.reward;render();showModal('领取成功','恭喜获得 ¥'+t.reward.toFixed(2)+' 演示奖励！')}function action(id){if(!requireLogin())return;let t=tasks[id];if(t.state==='待领取'){claim(id);return}if(t.state==='已领取'){openDetail(id);return}if(id===0||id===5){openDetail(id);return}if(id===3){t.state='待领取';t.button='领取奖励';t.metric='回归任务已完成';render();showModal('任务完成','已模拟完成回归任务，现在可以领取奖励。');return}openDetail(id)}function simulate(id){if(!requireLogin())return;let t=tasks[id];t.pct=100;t.state='待领取';t.button='领取奖励';t.metric='任务已达标，奖励待领取';render();showModal('任务已达标','已模拟完成任务，可领取奖励。')}function cards(){let arr=tasks.filter(t=>filter==='全部'||t.state===filter);return arr.length?'<div class="cards">'+arr.map(t=>'<div class="task"><div class="taskhead"><div class="taskico">'+t.icon+'</div><div><h3>'+t.name+' <span>'+t.tag+'</span></h3><p>'+t.desc+'</p></div></div><div><div class="metric">'+(logged?t.metric:'登录后查看任务进度')+'</div>'+(logged&&t.pct!==null?'<div class="bar"><div style="width:'+t.pct+'%"></div></div>':'')+'<div class="taskbottom"><b>'+(logged?(t.state==='已领取'?'已领取':t.state==='待领取'?'待领取奖励：¥'+t.reward.toFixed(2):'奖励 ¥'+t.reward.toFixed(2)):'登录后查看奖励')+'</b><button onclick="action('+t.id+')">'+(logged?t.button:'查看详情')+'</button></div></div></div>').join('')+'</div>':'<div class="empty">暂无相关任务</div>'}function home(){let pending=tasks.filter(t=>t.state==='待领取').reduce((a,t)=>a+t.reward,0);let done=tasks.filter(t=>t.state==='已领取'||t.state==='待领取').length;return '<div class="banner"><div><h1>👑 专属福利</h1><p>完成专属任务 · 领取丰厚奖励</p></div><div class="present"><svg class="gift-art" viewBox="0 0 320 200" aria-hidden="true"><defs><linearGradient id="giftBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5ec6ff"/><stop offset=".5" stop-color="#1167db"/><stop offset="1" stop-color="#053b9b"/></linearGradient><linearGradient id="giftGold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff3b0"/><stop offset=".45" stop-color="#ffbc35"/><stop offset="1" stop-color="#e67c00"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6"/></filter></defs><ellipse cx="173" cy="182" rx="110" ry="12" fill="#27aaff" opacity=".4" filter="url(#glow)"/><path d="M15 168 Q95 116 155 173 Q229 212 312 146" fill="none" stroke="#ffbd37" stroke-width="12" opacity=".95"/><g transform="translate(88 34) rotate(-5 88 80)"><path d="M16 73 L173 73 L164 171 L24 171 Z" fill="url(#giftBlue)" stroke="#78ccff" stroke-width="3"/><path d="M73 73 L110 73 L105 171 L77 171 Z" fill="url(#giftGold)"/><path d="M7 47 L184 47 L179 88 L13 88 Z" fill="url(#giftBlue)" stroke="#8dd7ff" stroke-width="3"/><path d="M74 47 L111 47 L111 88 L77 88 Z" fill="url(#giftGold)"/><path d="M92 50 C12 18 42 -6 85 23 L94 46 C128 -10 180 9 135 41 Z" fill="none" stroke="url(#giftGold)" stroke-width="15" stroke-linecap="round"/></g><g fill="url(#giftGold)" stroke="#fff2a8" stroke-width="2"><ellipse cx="47" cy="111" rx="14" ry="8" transform="rotate(30 47 111)"/><ellipse cx="275" cy="106" rx="16" ry="9" transform="rotate(-30 275 106)"/><ellipse cx="250" cy="39" rx="9" ry="5" transform="rotate(25 250 39)"/></g></svg></div></div><div class="stats"><div class="stat"><div class="stat-icon">🎁</div><div class="stat-info"><div class="name">待领取奖励</div><strong>¥ '+(logged?pending.toFixed(2):'--')+'</strong></div>'+(pending&&logged?'<button onclick="setFilter(\'待领取\')">去领取</button>':'')+'</div><div class="stat"><div class="stat-icon">🪙</div><div class="stat-info"><div class="name">已领取奖励</div><strong>¥ '+(logged?received.toFixed(2):'--')+'</strong></div></div><div class="stat"><div class="stat-icon">☑</div><div class="stat-info"><div class="name">已完成任务</div><strong>'+(logged?done+' / 6':'--')+'</strong></div></div></div><div class="filters">'+['全部','进行中','待领取','已领取'].map(f=>'<button class="'+(filter===f?'selected':'')+'" onclick="setFilter(\''+f+'\')">'+f+' ('+(f==='全部'?tasks.length:tasks.filter(t=>t.state===f).length)+')</button>').join('')+'</div>'+cards()+'<p class="hint">注：任务进度、奖励金额、统计口径均为原型演示数据；非现金类奖励不纳入现金金额汇总。</p>'}function details(){let t=tasks[detail];return '<button class="back" onclick="detail=null;render()">‹ 返回专属福利</button><div class="banner"><div><h1>'+t.name+'</h1><p>'+t.desc+'</p></div><div class="present">'+t.icon+'</div></div><div class="detail"><section class="panel"><h2>我的任务进度</h2><p class="muted">'+(logged?t.metric:'登录后查看任务进度')+'</p>'+(t.pct!==null?'<div class="bar"><div style="width:'+(logged?t.pct:0)+'%"></div></div>':'')+'<p>当前状态：<b style="color:#ffb33b">'+(logged?t.state:'未登录')+'</b></p><div class="large">¥ '+t.reward.toFixed(2)+'</div><p class="muted">演示奖励金额</p><button class="primary" onclick="'+(t.state==='待领取'?'claim('+t.id+')':t.state==='已领取'?'showModal(\'已领取\',\'本次演示奖励已经领取。\')':'simulate('+t.id+')')+'">'+(t.state==='待领取'?'领取奖励':t.state==='已领取'?'已领取':'模拟完成任务')+'</button></section><section class="panel"><h2>活动内容</h2><p>'+t.desc+'</p><h3>任务奖励</h3><div class="reward-row"><span>奖励金额</span><b style="color:#ffb33b">¥ '+t.reward.toFixed(2)+'</b></div><h3>活动规则</h3><p class="muted">1. 具体参与资格、任务统计周期与奖励规则以运营配置为准。</p><p class="muted">2. 原型提供模拟完成与领取交互，不调用真实存款、投注或奖励接口。</p><p class="muted">3. 奖励领取后更新顶部累计金额与任务状态。</p></section></div>'}function promo(){return '<div class="banner"><div><h1>优惠活动</h1><p>限时 · 新人 · 日常 · VIP · 长期</p></div><div class="present">🎉</div></div><div class="panel" style="margin-top:18px"><h2>原有优惠活动专区</h2><p class="muted">本次仅演示一级入口切换，原有优惠活动列表及详情逻辑保持不变。</p><button class="primary" onclick="setSection(\'benefit\')">进入专属福利</button></div>'}function render(){document.getElementById('loginBtn').textContent=logged?'退出登录':'登录';document.getElementById('navPromo').classList.toggle('active',section==='promo');document.getElementById('navBenefit').classList.toggle('active',section==='benefit');document.getElementById('mobilePromo').classList.toggle('active',section==='promo');document.getElementById('mobileBenefit').classList.toggle('active',section==='benefit');document.getElementById('content').innerHTML=section==='promo'?promo():detail!==null?details():home()}resetDemo();
</script></body></html>
