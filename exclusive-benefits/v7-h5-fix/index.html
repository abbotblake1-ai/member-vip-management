const initial=[["每日存款","每日重置","👛","每日累计存款达标，领取对应奖励","今日存款：300 / 500 元",60,5,"进行中"],["晒单福利","任务奖励","📸","完成指定内容晒单并通过审核","任务已完成，可领取奖励",100,20,"待领取"],["存款三重礼","阶梯奖励","🎁","完成不同存款档位，解锁三重好礼","已完成 2 / 3 档",66,30,"已领取"],["沉默回归","回归专享","👤","符合条件会员可参与回归任务","符合参与条件",null,20,"进行中"],["周五存送","每周五","🗓️","每周五存款领取额外奖励","距下一次活动：2天12:36:20",null,88,"进行中"],["周期流水","周期任务","📊","周期内累计有效流水达标","累计流水：5,000 / 15,000 元",33,50,"进行中"]];
let tasks,received,filter,detail,section,login,isPhone=false;
function reset(){tasks=initial.map((x,i)=>({id:i,name:x[0],tag:x[1],icon:x[2],desc:x[3],metric:x[4],pct:x[5],reward:x[6],state:x[7]}));received=268;filter="全部";detail=-1;section="benefit";login=true;render()}
function device(m){isPhone=m;document.body.classList.toggle("phone",m);document.getElementById("pcbtn").classList.toggle("active",!m);document.getElementById("h5btn").classList.toggle("active",m);render()}
function pop(t,d){document.getElementById("modal").innerHTML='<div class="overlay" onclick="if(event.target===this)closePop()"><div class="dialog"><h2>'+t+'</h2><p>'+d+'</p><button onclick="closePop()">确定</button></div></div>'}
function closePop(){document.getElementById("modal").innerHTML=""}
function go(id){if(!login){pop("请先登录","登录后查看进度和领取奖励");return}let t=tasks[id];if(t.state==="待领取"){claimV7(id);return}openV7(id)}
function complete(id){if(!login){pop("请先登录","请登录后操作");return}tasks[id].state="待领取";tasks[id].pct=100;tasks[id].metric="任务已完成，奖励待领取";detail=-1;render();pop("任务已完成","现在可以领取奖励")}
function cards(){let list=tasks.filter(t=>filter==="全部"||t.state===filter);return '<div class="tasks">'+list.map(t=>'<article class="task"><div class="tasktop"><span class="icon">'+t.icon+'</span><div><h3>'+t.name+' <em>'+t.tag+'</em></h3><p>'+t.desc+'</p></div></div><div><div class="muted">'+(login?t.metric:"登录后查看进度")+'</div>'+(t.pct!==null?'<div class="progress"><div style="width:'+(login?t.pct:0)+'%"></div></div>':'')+'<div class="bottom"><b>'+(t.state==="已领取"?"已领取":t.state==="待领取"?"待领取 ¥"+t.reward.toFixed(2):"奖励 ¥"+t.reward.toFixed(2))+'</b><button onclick="go('+t.id+')">'+(t.state==="待领取"?"领取奖励":t.state==="已领取"?"查看详情":"去完成")+'</button></div></div></article>').join('')+'</div>'}
function home(){let pending=tasks.filter(t=>t.state==="待领取").reduce((n,t)=>n+t.reward,0);let done=tasks.filter(t=>t.state==="已领取").length;return '<picture><source media="(max-width:700px)" srcset="'+bannerH5+'"><img class="banner" src="'+(isPhone?bannerH5:bannerPC)+'" alt="专属福利：完成专属任务，领取丰厚奖励"></picture><div class="stats"><div class="stat"><div class="ico">🎁</div><div><small>待领取奖励</small><strong>¥ '+(login?pending.toFixed(2):"--")+'</strong></div></div><div class="stat"><div class="ico">🪙</div><div><small>已领取奖励</small><strong>¥ '+(login?received.toFixed(2):"--")+'</strong></div></div><div class="stat"><div class="ico">☑</div><div><small>已完成任务</small><strong>'+(login?done+" / 6":"--")+'</strong></div></div></div><div class="filters">'+["全部","进行中","待领取","已领取"].map(f=>'<button class="'+(filter===f?"active":"")+'" onclick="filter=\''+f+'\';render()">'+f+' ('+(f==="全部"?tasks.length:tasks.filter(t=>t.state===f).length)+')</button>').join("")+'</div>'+cards()}
function details(){let t=tasks[detail];return '<button class="primary" onclick="detail=-1;render()">← 返回</button><h2>'+t.name+'</h2><div class="detail"><div class="panel"><h3>任务进度</h3><p>'+t.metric+'</p><div class="progress"><div style="width:'+(t.pct||0)+'%"></div></div><h2>奖励 ¥'+t.reward.toFixed(2)+'</h2><button class="primary" onclick="'+(t.state==="待领取"?"go("+t.id+")":"complete("+t.id+")")+'">'+(t.state==="待领取"?"领取奖励":"模拟完成任务")+'</button></div><div class="panel"><h3>活动规则</h3><p>'+t.desc+'</p><p>本页面为可交互演示，奖励金额和任务状态均为模拟数据。</p></div></div>'}

let v7Active=null;
function openV7(id){if(!login){pop("请先登录","登录后查看进度和领取奖励");return}v7Active=id;drawV7()}
function closeV7(){v7Active=null;document.getElementById("v7-overlay").innerHTML=""}
function claimV7(id){let t=tasks[id];if(!login){pop("请先登录","登录后领取奖励");return}if(t.state==="已领取"){pop("领取记录","该奖励已领取（演示数据）");return}if(t.state!=="待领取"){openV7(id);return}t.state="已领取";received+=t.reward;render();if(v7Active===id)drawV7();pop("领取成功","已领取 ¥"+t.reward.toFixed(2)+"（演示数据）")}
function v7Simulate(id){let t=tasks[id];if(t.state==="已领取"){pop("已领取","本次奖励已领取");return}t.state="待领取";t.pct=100;t.metric="任务已达标，奖励待领取";render();drawV7();pop("演示：任务达标","现在可以领取奖励")}
function v7Action(id){let t=tasks[id];if(t.state==="待领取"){closeV7();claimV7(id)}else if(t.state==="已领取"){pop("领取记录","已领取 ¥"+t.reward.toFixed(2)+"（演示数据）")}else{pop(t.id===0||t.id===2||t.id===4?"前往存款":t.id===5?"前往投注":t.id===1?"前往晒单":"参与活动","此处为原型演示，正式版接入对应业务页面。弹窗保留，可返回查看任务。")}}
function drawV7(){
if(v7Active===null)return;
let t=tasks[v7Active],pct=t.pct===null?0:t.pct,ready=t.state==="待领取",claimed=t.state==="已领取";
let title=t.id===0?"今日累计存款":t.id===2?"存款档位进度":t.id===5?"周期有效流水":t.id===4?"本周五任务":t.id===1?"晒单审核进度":"回归参与资格";
let period=t.id===0?"每日 00:00 重置":t.id===4?"每周五开放":t.id===5?"按活动周期统计":t.id===2?"活动期间累计":t.id===1?"审核通过后领取":"符合回归条件后参与";
let tiers=t.id===2?'<div class="v7-tier"><div>第1档<small>存款达标</small></div><b>¥10.00 ✓</b></div><div class="v7-tier"><div>第2档<small>存款达标</small></div><b>¥20.00 ✓</b></div><div class="v7-tier"><div>第3档<small>继续完成任务</small></div><b>¥30.00</b></div>':"";
let note=t.id===1?"晒单提交后需审核，审核通过才可领取奖励。":t.id===3?"仅符合回归条件的会员可参与，资格以后台判断为准。":t.id===4?"未到活动开放时间时展示倒计时或未开始状态。":t.id===5?"有效投注流水按活动指定场馆及结算规则累计。":t.id===2?"不同档位的奖励与领取方式以活动配置为准。":"当日累计存款达标后可领取奖励，次日重新统计。";
let action=ready?"领取奖励":claimed?"查看领取记录":t.id===1?"去晒单":t.id===3?"立即参与":t.id===5?"去投注":"去存款";
document.getElementById("v7-overlay").innerHTML='<div class="v7-shade" onclick="if(event.target===this)closeV7()"><div class="v7-modal" role="dialog" aria-modal="true" aria-label="'+t.name+'任务详情"><div class="v7-head"><span class="v7-icon">'+t.icon+'</span><div class="v7-heading"><h2>'+t.name+'</h2><p>'+t.desc+'</p></div><button class="v7-close" onclick="closeV7()" aria-label="关闭">×</button></div><div class="v7-body"><div class="v7-period"><span>⏱ '+period+'</span><span>'+t.tag+'</span></div><div class="v7-label">'+title+'</div><div class="v7-metric"><strong>'+t.metric+'</strong>'+(t.pct===null?'':'<b>'+pct+'%</b>')+'</div>'+(t.pct===null?'':'<div class="v7-progress"><span style="width:'+pct+'%"></span></div>')+'<div class="v7-reward"><div><span class="v7-label">达标奖励</span><strong>¥ '+t.reward.toFixed(2)+'</strong></div><span class="v7-status">'+(claimed?"已领取":ready?"待领取":"未达标")+'</span></div>'+tiers+'<div class="v7-note">'+note+'</div><div class="v7-actions"><button onclick="v7Action('+t.id+')">'+action+'</button>'+(claimed?'':'<button class="secondary" onclick="v7Simulate('+t.id+')">模拟达标</button>')+'</div><details class="v7-rules"><summary>活动规则（点击展开）</summary><p>1. 仅符合活动条件的会员可参与。<br>2. '+period+'，具体统计口径以活动配置为准。<br>3. 达标后按奖励领取条件及审核结果发放。<br>4. 活动奖励、有效投注和周期等均以正式业务规则为准。</p></details><p class="v7-footnote">当前为交互演示，金额、状态及跳转均为模拟数据。</p></div></div></div>'
}
function render(){const foot=document.getElementById("foot-section");if(foot){foot.textContent=section==="promo"?"🎁 优惠活动":"♛ 专属福利";foot.classList.add("selected")};document.getElementById("loginbtn").textContent=login?"退出登录":"登录";for(let k of ["pnav","ptab"])document.getElementById(k).classList.toggle("selected",section==="promo");for(let k of ["bnav","btab"])document.getElementById(k).classList.toggle("selected",section==="benefit");document.getElementById("content").innerHTML=section==="promo"?'<div class="panel"><h2>优惠活动</h2><p>原有优惠活动页面保持不变。</p><button class="primary" onclick="section=\'benefit\';render()">进入专属福利</button></div>':detail>=0?details():home()}
reset();
</script></body></html>
